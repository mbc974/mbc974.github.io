<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MBC · Banc de contrôle</title><style>
body{margin:0;padding:16px;background:#dce4ec;color:#07101e;font:16px Arial}form{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}button,select,input{font:inherit;padding:8px}input{width:80px}pre{font-size:12px;white-space:pre-wrap}#stage{transform-origin:top left}iframe{border:0;background:#070d18}#metrics{max-width:1250px;min-height:42px}
</style></head><body><form id="controls"><label>Page <select name="page"><option value="/">Original</option><option value="/lab/motion/editorial/">A — Editorial</option><option value="/lab/motion/sport/">B — Sport</option><option value="/lab/motion/court/">C — Court Vision</option></select></label><label>Largeur <input name="width" type="number" value="390"></label><label>Hauteur <input name="height" type="number" value="844"></label><button>Afficher</button><button type="button" id="measure">Mesurer</button></form><pre id="metrics" aria-live="polite">Chargement…</pre><div id="stage"><iframe id="frame" title="Site à contrôler"></iframe></div><script>
const form=document.querySelector('form'),frame=document.querySelector('iframe'),stage=document.querySelector('#stage');
const params=new URLSearchParams(location.search);const target=params.get('target');if(['editorial','sport','court'].includes(target))form.page.value='/lab/motion/'+target+'/';if(params.has('w'))form.width.value=Math.max(320,Math.min(2560,Number(params.get('w'))||390));if(params.has('h'))form.height.value=Math.max(360,Math.min(1600,Number(params.get('h'))||844));
function load(){const w=Number(form.width.value),h=Number(form.height.value);frame.width=w;frame.height=h;const scale=Math.min(1,(innerWidth-32)/w);stage.style.transform=`scale(${scale})`;stage.style.height=h*scale+'px';frame.src=form.page.value+'?qa=1';}
form.addEventListener('submit',e=>{e.preventDefault();load();});document.querySelector('#measure').onclick=()=>frame.contentWindow.postMessage('mbc-measure',location.origin);addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data.kind==='mbc-qa')document.querySelector('#metrics').textContent=JSON.stringify(e.data,null,0);});load();
</script></body></html>
