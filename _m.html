<!DOCTYPE html><html><head><meta charset="utf-8"><title>m</title></head><body><pre id="out">…</pre>
<script>
try{localStorage.setItem('mbc-consent','refused');}catch(e){}
var f=document.createElement('iframe');f.width=1280;f.height=900;f.src='/index.html';
f.style.position='absolute';f.style.left='-9999px';
f.onload=function(){setTimeout(function(){
 var d=f.contentDocument,w=f.contentWindow;
 var s=d.createElement('style');s.textContent='.section{content-visibility:visible!important}.reveal{opacity:1!important;transform:none!important}';
 d.head.appendChild(s);d.body.getBoundingClientRect();
 setTimeout(function(){
  var L=[];
  function dis(sel,el){
   var k=w.getComputedStyle(el),r=el.getBoundingClientRect();
   L.push(sel);
   L.push('   boite      '+Math.round(r.width)+'x'+Math.round(r.height));
   L.push('   border     '+k.borderTopWidth+' '+k.borderTopStyle+' '+k.borderTopColor+'  | bas '+k.borderBottomWidth+' '+k.borderBottomColor);
   L.push('   background '+k.backgroundImage.slice(0,70)+(k.backgroundImage.length>70?'…':''));
   L.push('   bg-color   '+k.backgroundColor);
   L.push('   box-shadow '+k.boxShadow.slice(0,70));
   L.push('   outline    '+k.outlineWidth+' '+k.outlineStyle);
  }
  var card=d.querySelector('.sponsors-row .sponsor-card');
  dis('LI (parent)', card.parentElement);
  dis('.sponsor-card', card);
  dis('.sponsor-card__plate', card.querySelector('.sponsor-card__plate'));
  dis('.sponsor-card__name', card.querySelector('.sponsor-card__name'));
  // pseudo-elements
  ['::before','::after'].forEach(function(p){
   var k=w.getComputedStyle(card,p);
   if(k.content&&k.content!=='none') L.push('.sponsor-card'+p+' content='+k.content+' bg='+k.backgroundColor+' border='+k.borderTopWidth);
   var k2=w.getComputedStyle(card.parentElement,p);
   if(k2.content&&k2.content!=='none') L.push('LI'+p+' content='+k2.content+' bg='+k2.backgroundColor+' border='+k2.borderTopWidth);
  });
  document.getElementById('out').textContent=L.join('\n');
 },500);},1500);};
document.body.appendChild(f);
</script></body></html>
