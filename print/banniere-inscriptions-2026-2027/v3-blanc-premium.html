<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bannière MBC 300x100 — V3 Blanc Premium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap">
<style>
  /* Canvas = 3000 x 1000 px → 300 x 100 cm (1px = 1mm) */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:3000px;height:1000px;overflow:hidden}
  body{
    font-family:'Barlow',sans-serif;color:#0D1526;position:relative;
    background:
      radial-gradient(1600px 1000px at 90% 0%, rgba(232,130,42,.10), transparent 55%),
      radial-gradient(1400px 900px at 5% 100%, rgba(27,81,158,.10), transparent 60%),
      linear-gradient(180deg,#FFFFFF,#F2F6FB);
  }
  .court{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .arc{position:absolute;border:6px solid rgba(27,81,158,.10);border-radius:50%}
  .a1{width:1600px;height:1600px;left:-560px;top:-300px}
  .a2{width:1200px;height:1200px;left:-360px;top:-100px;border-color:rgba(217,106,27,.12)}
  .a3{width:1900px;height:1900px;right:-700px;bottom:-1200px}
  .slash{position:absolute;top:0;bottom:0;right:-200px;width:480px;
    background:linear-gradient(180deg,#1B519E,#0D1526);transform:skewX(-14deg);opacity:.06}

  .main{position:absolute;top:0;left:0;right:0;height:735px;display:flex;align-items:center;padding:0 80px;gap:75px}

  .logo-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .logo-wrap img{width:600px;height:600px;object-fit:contain;
    filter:drop-shadow(0 18px 45px rgba(13,21,38,.25))}

  .text{flex:1 1 auto;min-width:0}
  .kicker{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.2em;font-size:38px;color:#1B519E;margin-bottom:26px;white-space:nowrap}
  .kicker b{color:#A84B08}
  h1{font-family:'Anton',sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:2px}
  h1 .l1{display:block;font-size:225px;color:#0D1526}
  h1 .l2{display:flex;align-items:center;gap:40px;font-size:225px;color:#D96A1B}
  .yr{font-family:'Anton',sans-serif;font-size:80px;color:#fff;background:#1B519E;
    padding:12px 30px 8px;border-radius:16px;letter-spacing:3px;line-height:1;flex:0 0 auto}
  .chips{display:flex;gap:26px;margin-top:44px}
  .chip{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;font-size:44px;padding:16px 32px;border-radius:14px;
    border:3px solid rgba(27,81,158,.4);color:#0D1526;white-space:nowrap;background:#fff}
  .chip--hot{border-color:#D96A1B;background:#FDF1E6;color:#0D1526}
  .chip--hot b{color:#A84B08}

  .cta{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;margin-right:40px}
  .cta__lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.26em;font-size:44px;color:#46617E}
  .cta__box{font-family:'Anton',sans-serif;font-size:118px;letter-spacing:2px;color:#fff;
    background:linear-gradient(180deg,#1B519E,#123A73);padding:34px 54px 26px;border-radius:22px;
    box-shadow:0 24px 70px rgba(27,81,158,.35);line-height:1;text-transform:uppercase}
  .cta__soc{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:40px;
    letter-spacing:.1em;color:#46617E;text-transform:uppercase}
  .cta__soc b{color:#A84B08}

  /* Bandeau partenaires — bleu nuit */
  .partners{position:absolute;left:0;right:0;bottom:0;height:265px;background:#0D1526;
    display:flex;align-items:center;padding:0 80px;gap:44px}
  .partners::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;
    background:linear-gradient(90deg,#E8822A,#D96A1B)}
  .partners__lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.2em;font-size:44px;color:#BFD2E4;line-height:1.25;flex:0 0 auto}
  .partners__lbl b{display:block;color:#E8822A;font-size:54px}
  .plates{display:flex;flex:1 1 auto;gap:40px;justify-content:space-evenly;align-items:center}
  .plate{background:#fff;border-radius:20px;height:190px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:16px 36px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .plate img{height:154px;width:auto;max-width:480px;object-fit:contain}
</style>
</head>
<body>
  <div class="court">
    <div class="arc a1"></div><div class="arc a2"></div><div class="arc a3"></div>
  </div>
  <div class="slash"></div>

  <div class="main">
    <div class="logo-wrap">
      <img src="../../assets/logos/mbc-logo.png" alt="MBC La Montagne Basket Club">
    </div>
    <div class="text">
      <p class="kicker">La Montagne Basket Club · <b>Saint-Denis — La Réunion</b> · Club affilié FFBB</p>
      <h1>
        <span class="l1">Inscriptions</span>
        <span class="l2">Ouvertes <span class="yr">2026 / 2027</span></span>
      </h1>
      <div class="chips">
        <span class="chip">Baby Basket → Seniors</span>
        <span class="chip">Filles &amp; Garçons</span>
        <span class="chip chip--hot">Licence <b>95 €</b> — FFBB &amp; assurance incluses</span>
      </div>
    </div>
    <div class="cta">
      <span class="cta__lbl">Je m'inscris sur</span>
      <span class="cta__box">mbc974.com</span>
      <span class="cta__soc"><b>@mbc974.re</b> · Facebook · Instagram · TikTok</span>
    </div>
  </div>

  <div class="partners">
    <p class="partners__lbl">Nos<b>Partenaires</b></p>
    <div class="plates">
      <div class="plate"><img src="./logos/sponsor-agitateurs-midi-trim.png" alt="Les Agitateurs du Midi"></div>
      <div class="plate"><img src="./logos/sponsor-cpa-paysage-trim.png" alt="CPA Paysage"></div>
      <div class="plate"><img src="./logos/sponsor-saint-francois-trim.png" alt="Association Saint-François d'Assise"></div>
      <div class="plate"><img src="./logos/sponsor-resto-chen-trim.png" alt="Resto Chen"></div>
      <div class="plate"><img src="./logos/sponsor-oxysom-trim.png" alt="Oxysom"></div>
    </div>
  </div>
</body>
</html>
